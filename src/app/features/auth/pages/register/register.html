<form [formGroup]='registerForm' (ngSubmit)="onSubmit()"
  class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
  <h2 class="mb-6 text-2xl font-semibold tracking-tight text-slate-900">
    {{title}}
  </h2>

  <label class="mb-1.5 block text-sm font-medium text-slate-700" for="first_name">
    First Name
  </label>

  <input formControlName="first_name"
    class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    placeholder='First Name' id='first_name' name='first_name' type='text' />

  <label class="mb-1.5 block text-sm font-medium text-slate-700" for="last_name">
    Last Name
  </label>

  <input formControlName="last_name"
    class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    placeholder='Last Name' id='last_name' name='last_name' type='text' />

  <label class="mb-1.5 block text-sm font-medium text-slate-700" for="email">
    Email
  </label>

  <input formControlName="email"
    class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    placeholder='Email' id='email' name='email' type='email' />


  <label class="mb-1.5 block text-sm font-medium text-slate-700" for="password">
    Password
  </label>

  <input formControlName="password"
    class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    placeholder='Password' id='password' name='password' type='password' />

  <label class="mb-1.5 block text-sm font-medium text-slate-700" for="confirm_password">
    Confirm Password
  </label>

  <input formControlName="confirm_password"
    class="mb-3 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
    placeholder='Confirm Password' id='confirm_password' name='confirm_password' type='password' />

  @if( error && error.trim()!==''){
  <p role="alert" class="mb-4 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">
    {{error}}
  </p>}

  <button
    class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
    Register
  </button>
</form>
